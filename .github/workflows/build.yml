name: Build

concurrency:
  group: build-macos
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update JUCE to 8.0.8 - macOS 15 fix
        run: |
          cd JUCE
          git fetch --tags
          git checkout 8.0.8
          git log --oneline -1
          cd ..

      - name: Show available Xcodes
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          uname -m

      - name: Configure CMake - macOS 15 Intel Only
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-EXCITER-macOS-INTEL
          path: |
            build/EC_AIR_artefacts/Release/VST3/*.vst3
            build/EC_AIR_artefacts/Release/AU/*.component
            build/EC_AIR_artefacts/Release/Standalone/*.app
          if-no-files-found: warnname: Build

concurrency:
  group: build-macos
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xcode 15.4 - SDK 14.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Show available Xcodes
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          uname -m

      - name: Configure CMake - macOS 15 Runner / Intel Only
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-EXCITER-macOS-INTEL
          path: |
            build/EC_AIR_artefacts/Release/VST3/*.vst3
            build/EC_AIR_artefacts/Release/AU/*.component
            build/EC_AIR_artefacts/Release/Standalone/*.app
          if-no-files-found: warn
