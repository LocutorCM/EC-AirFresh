name: Build

concurrency:
  group: build-macos
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix JUCE - Use 8.0.8
        run: |
          if [ -d "JUCE/.git" ]; then
            cd JUCE
            git fetch --tags
            git checkout 8.0.8
            cd ..
          elif [ -d "juce/.git" ]; then
            cd juce
            git fetch --tags
            git checkout 8.0.8
            cd ..
          else
            echo "Clonando JUCE 8.0.8 limpio"
            rm -rf JUCE
            git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git JUCE
          fi

          # Verificar que el archivo NO esta roto por un parche anterior
          echo "--- Verificando juce_Windowing_mac.mm ---"
          grep -n "CGWindowListCreateImage\|windowNumber" JUCE/modules/juce_gui_basics/native/juce_Windowing_mac.mm | head -20
          # Si aparece "nullptr [nsWindow" es que el parche malo lo rompio
          if grep -q "nullptr \[nsWindow" JUCE/modules/juce_gui_basics/native/juce_Windowing_mac.mm; then
            echo "ERROR: Archivo corrupto por parche anterior, restaurando..."
            cd JUCE && git checkout -- modules/juce_gui_basics/native/juce_Windowing_mac.mm && cd ..
          fi
          echo "Archivo OK"

          # NO parcheamos CGWindowListCreateImage.
          # En JUCE 8.0.8 ya esta corregido para Xcode 16 / macOS 15.
          # El parche anterior que lo cambiaba por 'nullptr' era el que rompia la compilacion.

      - name: Show available Xcodes
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          uname -m

      - name: Configure CMake - macOS 15 Intel Only
        env:
          FETCHCONTENT_SOURCE_DIR_JUCE: ${{ github.workspace }}/JUCE
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DFETCHCONTENT_SOURCE_DIR_JUCE=${{ github.workspace }}/JUCE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-EXCITER-macOS-INTEL
          path: |
            build/EC_AIR_artefacts/Release/VST3/*.vst3
            build/EC_AIR_artefacts/Release/AU/*.component
            build/EC_AIR_artefacts/Release/Standalone/*.app
          if-no-files-found: warn
