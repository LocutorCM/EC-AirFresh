name: Build EC_AIR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Como lo pediste: 15-intel
    runs-on: macos-15-intel

    env:
      # ESTO ES LO QUE HACE QUE JALE EN MONTEREY
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SDKROOT: macosx

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_CXX_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_C_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_EXE_LINKER_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_SHARED_LINKER_FLAGS="-mmacosx-version-min=12.0" \
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check Compatibility
        run: |
          echo "=== Arquitecturas ==="
          lipo -info "build/EC_AIR_artefacts/Release/AU/EC_AIR.component/Contents/MacOS/EC_AIR"
          echo "=== Min macOS ==="
          otool -l "build/EC_AIR_artefacts/Release/AU/EC_AIR.component/Contents/MacOS/EC_AIR" | grep -A 3 LC_BUILD_VERSION
          vtool -show-build "build/EC_AIR_artefacts/Release/AU/EC_AIR.component/Contents/MacOS/EC_AIR" || true

      - name: Package
        run: |
          mkdir -p pkg_stage
          cp -R "build/EC_AIR_artefacts/Release/AU/EC_AIR.component" pkg_stage/
          cp -R "build/EC_AIR_artefacts/Release/VST3/EC_AIR.vst3" pkg_stage/
          cp -R "build/EC_AIR_artefacts/Release/Standalone/EC_AIR.app" pkg_stage/
          cd pkg_stage && zip -r ../EC_AIR_macOS_12_Plus_Universal.zip . && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EC_AIR_macOS_12_Plus_Universal
          path: EC_AIR_macOS_12_Plus_Universal.zip
