name: Build

concurrency:
  group: build-macos
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show available Xcodes
        run: |
          ls /Applications/ | grep Xcode
          xcodebuild -version
          xcrun --show-sdk-path
          uname -m

      - name: Configure CMake - macOS 14 Intel Only
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-EXCITER-macOS-INTEL
          path: |
            build/EC_AIR_artefacts/Release/VST3/*.vst3
            build/EC_AIR_artefacts/Release/AU/*.component
            build/EC_AIR_artefacts/Release/Standalone/*.app
          if-no-files-found: warn
