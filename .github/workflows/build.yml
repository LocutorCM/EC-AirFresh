name: Build EC_AIR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Find AU and check
        run: |
          echo "=== Buscando AU ==="
          find build -name "*.component" -type d
          AU_PATH=$(find build -name "EC_AIR.component" -type d | head -n 1)
          echo "AU_PATH=$AU_PATH"
          echo "AU_PATH=$AU_PATH" >> $GITHUB_ENV
          if [ -z "$AU_PATH" ]; then
            echo "ERROR: No se encontro EC_AIR.component"
            ls -R build/EC_AIR_artefacts || true
            exit 1
          fi
          ls -lh "$AU_PATH/Contents/MacOS/"
          lipo -info "$AU_PATH/Contents/MacOS/EC_AIR"
          echo "=== Deployment Target ==="
          otool -l "$AU_PATH/Contents/MacOS/EC_AIR" | grep -A 2 LC_BUILD_VERSION || otool -l "$AU_PATH/Contents/MacOS/EC_AIR" | grep -A 2 LC_VERSION_MIN_MACOSX

      - name: Package
        run: |
          mkdir -p package
          cp -R "$AU_PATH" package/
          # VST3 si existe
          VST3_PATH=$(find build -name "EC_AIR.vst3" -type d | head -n 1)
          if [ -n "$VST3_PATH" ]; then
            cp -R "$VST3_PATH" package/
          fi
          # Standalone si existe
          APP_PATH=$(find build -name "EC_AIR.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" package/
          fi
          ls -lh package/
          cd package && zip -r ../EC_AIR_macOS_12_Plus_Universal.zip . && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC_AIR_macOS_12_Plus_Universal
          path: EC_AIR_macOS_12_Plus_Universal.zip
