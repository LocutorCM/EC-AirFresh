            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DFETCHCONTENT_SOURCE_DIR_JUCE=${{ github.workspace }}/JUCE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-EXCITER-macOS-INTEL
          path: |
            build/EC_AIR_artefacts/Release/VST3/*.vst3
            build/EC_AIR_artefacts/Release/AU/*.component
            build/EC_AIR_artefacts/Release/Standalone/*.app
          if-no-files-found: warn
